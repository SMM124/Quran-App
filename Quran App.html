            { ar: "ٱلْبَدِيع", bn: "আল- বদি", mean: "অতুলনীয়", en: "Al-Badi" },
            { ar: "ٱلْبَاقِي", bn: "আল-বাকি", mean: "অবিনশ্বর", en: "Al-Baqi" },
            { ar: "ٱلْوَارِث", bn: "আল-ওয়ারিস", mean: "উত্তরাধিকারী", en: "Al-Warith" },
            { ar: "ٱلرَّشِيد", bn: "আর-রশিদ", mean: "সত্যপথ প্রদর্শক", en: "Ar-Rashid" },
            { ar: "ٱلصَّبُور", bn: "আস-সাবুর", mean: "ধৈর্যশীল", en: "As-Sabur" }
        ];

        // --- ICON WRAPPER ---
        const IconWrapper = ({ name, size = 24, className, ...props }) => {
            const iconData = window.lucide && window.lucide.icons ? window.lucide.icons[name] : null;
            if (!iconData) return null;
            return createElement('svg', {
                xmlns: "http://www.w3.org/2000/svg",
                width: size,
                height: size,
                viewBox: "0 0 24 24",
                fill: "none",
                stroke: "currentColor",
                strokeWidth: 2,
                strokeLinecap: "round",
                strokeLinejoin: "round",
                className: className,
                ...props
            }, iconData.map(([tag, attrs], index) => createElement(tag, { ...attrs, key: index })));
        };
        const createIcon = (name) => (props) => <IconWrapper name={name} {...props} />;
        
        // Icons
        const Home = createIcon('Home');
        const BookOpen = createIcon('BookOpen');
        const Search = createIcon('Search');
        const Play = createIcon('Play');
        const Pause = createIcon('Pause');
        const Copy = createIcon('Copy');
        const Check = createIcon('Check');
        const ChevronLeft = createIcon('ChevronLeft');
        const Menu = createIcon('Menu');
        const X = createIcon('X');

        const SkipBack = createIcon('SkipBack');

        const Sparkles = createIcon('Sparkles');
        const Send = createIcon('Send');
        const Loader2 = createIcon('Loader2');
        const Info = createIcon('Info');
        const FileText = createIcon('FileText');
        const History = createIcon('History');
        const Lightbulb = createIcon('Lightbulb');
        const List = createIcon('List');
        const User = createIcon('User');
        const SunMedium = createIcon('SunMedium');
        const ArrowRight = createIcon('ArrowRight');
        const BrainCircuit = createIcon('BrainCircuit');
        const Star = createIcon('Star');
        const RefreshCw = createIcon('RefreshCw');
        const CheckCircle2 = createIcon('CheckCircle2');
        const Heart = createIcon('Heart');
        const Gauge = createIcon('Gauge');
        const Moon = createIcon('Moon');
        const Shield = createIcon('Shield');
        const HandHeart = createIcon('HandHeart');
        const Car = createIcon('Car');
        const Settings = createIcon('Settings');
        const Save = createIcon('Save');
        const Mic = createIcon('Mic');

        // --- IMPROVED MARKDOWN RENDERER ---
        const MarkdownRenderer = ({ content }) => {
            if (!content || typeof content !== 'string') return null; // FIX: Ensure content is a string
            const lines = content.split('\n');
            let elements = [];
            let tableRows = [];
            let inTable = false;

            const renderTable = (rows, key) => {
                if (!rows || rows.length === 0) return null;
                const header = rows[0];
                const body = rows.slice(1);
                return (
                    <div key={key} className="ai-table-container">
                        <table className="ai-table">
                            <thead><tr>{header.map((h, i) => <th key={i} dangerouslySetInnerHTML={{ __html: h }} />)}</tr></thead>
                            <tbody>{body.map((row, i) => (<tr key={i}>{row.map((c, j) => <td key={j} dangerouslySetInnerHTML={{ __html: c }} />)}</tr>))}</tbody>
                        </table>
                    </div>
                );
            };

            const parseInline = (text) => {
                let parsed = text;
                // Enhanced Bold Regex: Handles Bengali characters and spaces better
                parsed = parsed.replace(/\*\*(.+?)\*\*/g, '<span class="markdown-bold">$1</span>');
                // Enhanced Italic Regex
                parsed = parsed.replace(/\*(.+?)\*/g, '<span class="markdown-italic">$1</span>');
                return parsed;
            };

            lines.forEach((line, idx) => {
                const trimmed = line.trim();
                if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
                    if (!inTable) inTable = true;
                    if (!trimmed.includes('---')) tableRows.push(trimmed.split('|').filter(c => c !== '').map(c => parseInline(c.trim())));
                    if (idx === lines.length - 1) elements.push(renderTable(tableRows, `tbl-${idx}`));
                } else {
                    if (inTable) { elements.push(renderTable(tableRows, `tbl-${idx}`)); tableRows = []; inTable = false; }
                    if (trimmed === '') elements.push(<div key={`br-${idx}`} className="h-3"></div>);
                    else if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) elements.push(<div key={idx} className="flex gap-2 mb-1"><span className="text-green-500 mt-1">•</span><span className="leading-relaxed" dangerouslySetInnerHTML={{ __html: parseInline(trimmed.substring(2)) }} /></div>);
                    else if (trimmed.startsWith('### ')) elements.push(<h3 key={idx} className="text-xl font-bold text-green-400 mt-4 mb-2" dangerouslySetInnerHTML={{ __html: parseInline(trimmed.substring(4)) }} />);
                    else if (trimmed.startsWith('## ')) elements.push(<h2 key={idx} className="text-2xl font-bold text-green-500 mt-5 mb-3" dangerouslySetInnerHTML={{ __html: parseInline(trimmed.substring(3)) }} />);
                    else elements.push(<p key={idx} className="mb-2 leading-relaxed text-gray-200" dangerouslySetInnerHTML={{ __html: parseInline(trimmed) }} />);
                }
            });
            return <div className="markdown-content text-sm md:text-base">{elements}</div>;
        };

        const fetchGeminiResponse = async (prompt, isJson = false) => {
            // Get API key from localStorage dynamically
            const storedKey = localStorage.getItem('gemini_api_key');
            // If user provided a key, use it. Otherwise use the default hardcoded one (empty string in code, but user can set one)
            const finalApiKey = storedKey || ""; 

            if (!finalApiKey) return isJson ? null : "API Key সেট করা নেই। দয়া করে সেটিংসে গিয়ে আপনার API Key যুক্ত করুন।";
            
            try {
                let finalPrompt = `You are a knowledgeable Islamic Scholar. Answer query in Bengali. 
                Guidelines: 
                1. Proper Islamic terms. 
                2. Deep explanation. 
                3. Respectful tone. 
                4. Use **Bold**, *Italics*. 
                ${isJson ? "Respond STRICTLY in JSON format. Do not use Markdown code blocks." : ""} 
                User Query: ${prompt}`;
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${finalApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: finalPrompt }] }], generationConfig: isJson ? { responseMimeType: "application/json" } : {} })
                });
                
                if (!response.ok) throw new Error("API Request Failed");

                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (isJson) {
                    const cleanedText = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    return JSON.parse(cleanedText);
                }
                
                return text || "তথ্য পাওয়া যায়নি।";
            } catch (e) { 
                console.error(e);
                return isJson ? null : "দুঃখিত, বর্তমানে এআই সেবাটি উপলব্ধ নেই বা আপনার API Key ভুল। সেটিংসে চেক করুন।"; 
            }
        };

                        <div className="p-6 md:p-8">{children}</div>

            );
        };

        const SettingsModal = ({ isOpen, onClose }) => {
            const [key, setKey] = useState('');
            const [saved, setSaved] = useState(false);

            useEffect(() => {

                    if(stored) setKey(stored);
                }
            }, [isOpen]);

            const handleSave = () => {
                localStorage.setItem('gemini_api_key', key);
                setSaved(true);
                setTimeout(() => setSaved(false), 2000);
            };

            const handleClear = () => {
                localStorage.removeItem('gemini_api_key');
                setKey('');
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity" onClick={onClose}></div>
                    <div className="relative w-full max-w-md bg-[#0f1f18] border border-gray-700 rounded-2xl shadow-2xl p-6 animate-fade-in text-white">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-xl font-bold flex items-center gap-2"><Settings className="w-6 h-6 text-green-500"/> সেটিংস</h3>
                            <button onClick={onClose}><X className="w-6 h-6 text-gray-400 hover:text-white"/></button>
                        </div>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm text-gray-400 mb-2">Gemini API Key</label>
                                <div className="relative">
                                    <input 
                                        type="password" 
                                        value={key} 
                                        onChange={(e) => setKey(e.target.value)}
                                        onCopy={(e) => e.preventDefault()}
                                        placeholder="এখানে আপনার API Key দিন"
                                        className="w-full bg-[#022c22] border border-gray-600 rounded-lg p-3 pr-10 text-white focus:outline-none focus:border-green-500 font-mono text-sm"
                                    />
                                    <div className="absolute right-3 top-3 text-gray-500 pointer-events-none">
                                        <Shield className="w-4 h-4"/>
                                    </div>
                                </div>
                                <p className="text-xs text-gray-500 mt-2">* কী (Key) ব্রাউজারে সুরক্ষিত থাকবে এবং দেখা যাবে না।</p>
                            </div>
                            
                            <div className="flex gap-3 pt-4">
                                <button onClick={handleSave} className="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold flex items-center justify-center gap-2">
                                    {saved ? <Check className="w-4 h-4"/> : <Save className="w-4 h-4"/>} সেভ করুন
                                </button>
                                <button onClick={handleClear} className="px-4 bg-red-900/30 hover:bg-red-900/50 text-red-400 border border-red-900/50 rounded-lg font-bold">
                                    মুছে ফেলুন
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Header = ({ setPage, activePage }) => {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [settingsOpen, setSettingsOpen] = useState(false);
            
            const navItems = [
                { key: 'home', label: "হোম", icon: Home },
                { key: 'surahList', label: "কুরআন", icon: BookOpen },
                { key: 'duas', label: "দোয়া", icon: HandHeart },

                                    >

        const HomeSection = ({ setPage, setSingleAyahData }) => {
            const today = new Date();
            const start = new Date(today.getFullYear(), 0, 0);
            const diff = today - start;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);
            // This logic ensures the verse changes every 24 hours based on the date
            const verseIndex = dayOfYear % (dailyVerses && dailyVerses.length ? dailyVerses.length : 1);
            const dailyVerse = dailyVerses ? dailyVerses[verseIndex] : { id: 1, surahId: 1, ayahId: 1, ar: "بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ", bn: "পরম করুণাময় ও অসীম দয়ালু আল্লাহর নামে শুরু করছি।", ref: "সূরা আল-ফাতিহা ১" };

            const handleReadFull = () => {

                setPage('singleAyah');

            return (
                <div className="container mx-auto px-4 py-12">

                        <div className="flex flex-col sm:flex-row gap-4 justify-center">

        };
        // ... (Other components: DuaPage, Names99Section, SurahDetail, SurahList, AIChatPage, SingleAyahView, App remain unchanged)
        // I will re-include them fully below for a complete file.

        const DuaPage = () => {
            const [activeCategory, setActiveCategory] = useState('kalima');
            const [searchQuery, setSearchQuery] = useState("");
            const [aiDuaResult, setAiDuaResult] = useState(null);
            const [isSearchingAI, setIsSearchingAI] = useState(false);
            const [selectedDua, setSelectedDua] = useState(null);

            const categories = [
                { id: 'kalima', label: 'কালেমা', icon: Star },
                { id: 'istighfar', label: 'ইস্তেগফার', icon: RefreshCw },
                { id: 'daily', label: 'দৈনন্দিন', icon: SunMedium },
                { id: 'travel', label: 'সফর', icon: Car },
                { id: 'protection', label: 'নিরাপত্তা', icon: Shield },
                { id: 'munajat', label: 'মুনাজাত', icon: HandHeart },
                { id: 'hadith', label: 'হাদিস', icon: BookOpen },
            ];

            const handleAISearch = async () => {
                if (!searchQuery.trim()) return;
                setIsSearchingAI(true);
                setAiDuaResult(null);
                const prompt = `Write the Dua for "${searchQuery}" in Arabic, Bangla pronunciation, and Bangla meaning. Output strictly in JSON format with keys: "title", "ar", "trans", "bn".`;
                const result = await fetchGeminiResponse(prompt, true);
                if (result && !result.error) {
                    setAiDuaResult(result);
                    setSelectedDua(result);
                }
                setIsSearchingAI(false);
            };

            const currentDuas = duasData[activeCategory] || [];
            const filteredDuas = currentDuas.filter(dua => 
                dua.title.includes(searchQuery) || 
                dua.bn.includes(searchQuery)
            );

            if (selectedDua) {
                return (
                    <div className="container mx-auto px-4 py-8 animate-fade-in max-w-4xl">
                         <button onClick={() => { setSelectedDua(null); setAiDuaResult(null); }} className="mb-6 flex items-center gap-2 px-4 py-2 rounded-xl bg-[#0a382e] hover:bg-[#0d4236] transition-colors text-gray-300">
                            <ChevronLeft className="w-5 h-5" /> ফিরে যান
                        </button>
                        
                        <div className="overflow-hidden rounded-2xl border border-gray-700 shadow-2xl bg-[#0a382e]">
                            <table className="w-full border-collapse">
                                <thead>
                                    <tr className="bg-green-900/40 border-b border-gray-700">
                                        <th className="p-6 text-center text-2xl font-bold text-gold font-serif" colSpan="2">
                                            {selectedDua.title}
                                        </th>
                                    </tr>
                                </thead>
                                <tbody className="text-sm md:text-base">
                                    {/* Arabic Row */}
                                    <tr className="bg-[#022c22] border-b border-gray-700">
                                        <td colSpan="2" className="p-8 text-right">
                                            <p className="font-arabic text-2xl md:text-4xl leading-[3] text-white">
                                                {selectedDua.ar}
                                            </p>
                                        </td>
                                    </tr>
                                    
                                    {/* Pronunciation Row */}
                                    {selectedDua.trans && (
                                        <tr className="border-b border-gray-700 bg-[#0a382e] hover:bg-[#0d4236] transition-colors">
                                            <td className="p-5 w-1/4 md:w-1/6 font-bold text-green-400 border-r border-gray-700 align-top">
                                                <div className="flex items-center gap-2">
                                                    <Mic className="w-4 h-4"/> উচ্চারণ
                                                </div>
                                            </td>
                                            <td className="p-5 text-gray-200 italic leading-relaxed">
                                                {selectedDua.trans}
                                            </td>
                                        </tr>
                                    )}
                                    
                                    {/* Meaning Row */}
                                    <tr className="bg-[#0a382e] hover:bg-[#0d4236] transition-colors">
                                        <td className="p-5 w-1/4 md:w-1/6 font-bold text-green-400 border-r border-gray-700 align-top">
                                            <div className="flex items-center gap-2">
                                                <FileText className="w-4 h-4"/> অর্থ
                                            </div>
                                        </td>
                                        <td className="p-5 text-gray-200 leading-relaxed">
                                            {selectedDua.bn || selectedDua.text}
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container mx-auto px-4 py-8 animate-fade-in">
                    <div className="text-center mb-10">
                        <h2 className="text-4xl font-bold text-green-400 mb-3 font-serif">দোয়া ও আমল</h2>
                        <p className="text-gray-400">প্রয়োজনীয় সব দোয়া এক সাথে</p>
                    </div>
                    
                    <div className="max-w-2xl mx-auto mb-10 relative group">
                        <div className="absolute -inset-1 bg-gradient-to-r from-green-600 to-emerald-600 rounded-full blur opacity-25 group-hover:opacity-50 transition duration-200"></div>
                        <div className="relative">
                            <input 
                                type="text" 
                                placeholder="কোন দোয়াটি খুঁজছেন? (যেমন: ঘুমানোর দোয়া)..." 
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full bg-[#0a382e] border border-gray-700 rounded-full py-4 pl-14 pr-4 text-white focus:outline-none focus:border-green-500 placeholder-gray-500 shadow-xl" 
                            />
                            <Search className="absolute left-5 top-1/2 transform -translate-y-1/2 w-6 h-6 text-gray-400" />
                        </div>
                    </div>

                    {!searchQuery && (
                        <div className="flex flex-wrap justify-center gap-3 mb-12">
                            {categories.map(cat => (
                                <button 
                                    key={cat.id} 
                                    onClick={() => setActiveCategory(cat.id)}
                                    className={`flex items-center gap-2 px-6 py-3 rounded-full font-bold transition-all border ${activeCategory === cat.id ? 'bg-green-600 text-white border-green-500 shadow-lg scale-105' : 'bg-[#0a382e] text-gray-400 hover:text-white border-gray-700 hover:border-gray-500'}`}
                                >
                                    <cat.icon className="w-4 h-4" /> {cat.label}
                                </button>
                            ))}
                        </div>
                    )}

                    <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-3 max-w-6xl mx-auto">
                        {filteredDuas.length > 0 ? (
                            filteredDuas.map((dua) => (
                                <div 
                                    key={dua.id} 
                                    onClick={() => setSelectedDua(dua)}
                                    className="bg-[#0a382e] border border-gray-700 rounded-2xl p-6 hover:border-green-500/50 cursor-pointer transition-all hover:bg-[#0d4236] group flex items-center justify-between hover:shadow-lg hover:-translate-y-1"
                                >
                                    <div>
                                        <h3 className="font-bold text-lg text-gray-200 group-hover:text-green-400 transition-colors mb-1">{dua.title}</h3>
                                        <p className="text-xs text-gray-500 truncate max-w-[200px]">{dua.bn}</p>
                                    </div>
                                    <div className="w-10 h-10 rounded-full bg-black/20 flex items-center justify-center group-hover:bg-green-600/20 transition-colors">
                                        <ArrowRight className="w-5 h-5 text-gray-500 group-hover:text-green-400" />
                                    </div>
                                </div>
                            ))
                        ) : searchQuery ? (
                            <div className="col-span-full text-center py-10">
                                <p className="text-gray-400 mb-6 text-lg">আপনার কাঙ্ক্ষিত দোয়াটি তালিকায় পাওয়া যায়নি।</p>
                                {!isSearchingAI && (
                                    <button 
                                        onClick={handleAISearch}
                                        className="bg-green-600 text-white px-8 py-4 rounded-full font-bold flex items-center gap-3 mx-auto hover:bg-green-700 transition-all shadow-lg hover:shadow-green-900/50"
                                    >
                                        <Sparkles className="w-5 h-5" /> এআই এর মাধ্যমে খুঁজুন
                                    </button>
                                )}
                                {isSearchingAI && <div className="text-green-400 animate-pulse mt-4 flex items-center justify-center gap-3 bg-green-900/20 py-3 rounded-full inline-flex px-6"><Loader2 className="w-5 h-5 animate-spin"/> ইসলামিক এআই উত্তর খুঁজছে...</div>}
                            </div>
                        ) : null}
                    </div>
                </div>
            );
        };

        const Names99Section = () => {
             const synthRef = useRef(window.speechSynthesis);

            const speakName = (text) => {
                if (synthRef.current.speaking) synthRef.current.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA'; 
                utterance.rate = 0.8;
                const voices = synthRef.current.getVoices();
                const arabicVoice = voices.find(v => v.lang.includes('ar'));
                if (arabicVoice) utterance.voice = arabicVoice;
                synthRef.current.speak(utterance);
            };

            return (
                <div className="container mx-auto px-4 py-8">
                    <div className="text-center mb-10">
                        <h1 className="text-4xl font-bold text-green-400 mb-4 font-serif">আসমাউল হুসনা</h1>
                        <p className="text-gray-400">আল্লাহর ৯৯টি গুণবাচক নাম ও অর্থ</p>
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        {names99Data.map((n, i) => (
                            <div key={i} className="bg-[#0a382e] border border-gray-700 rounded-2xl p-5 text-center transition-all group hover:-translate-y-1 relative hover:border-green-500/50 cursor-pointer hover:shadow-xl hover:bg-[#0d4236]">
                                <div className="text-3xl font-arabic text-green-400 mb-3 group-hover:scale-110 transition-transform h-16 flex items-center justify-center">{n.ar}</div>
                                <div className="font-bold text-white mb-1 text-lg">{n.bn}</div>
                                <div className="text-xs text-gray-500 uppercase tracking-widest mb-2">{n.en}</div>
                                <div className="text-xs text-green-400/80 mt-2 border-t border-gray-700 pt-2">{n.mean}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };
        
        const SurahDetail = ({ surahId, setPage, setToast }) => {
            const surahInfo = surahListFull.find(s => s.id === surahId) || surahListFull[0];
            const [ayahs, setAyahs] = useState([]);
            const [visibleCount, setVisibleCount] = useState(20);
            
            const [playingAyah, setPlayingAyah] = useState(null);
            const [isSurahPlaying, setIsSurahPlaying] = useState(false);
            const isPlayingRef = useRef(false);
            const audioRef = useRef(null);
            const [playbackRate, setPlaybackRate] = useState("1");
            const playbackRateRef = useRef(1.0);

            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState(null);
            const [showIntro, setShowIntro] = useState(false);
            const [showTafsir, setShowTafsir] = useState(false);
            const [surahData, setSurahData] = useState(null);
            const [activeTafsirAyah, setActiveTafsirAyah] = useState(null);
            const [tafsirText, setTafsirText] = useState("");
            const [copiedAyahId, setCopiedAyahId] = useState(null);

            useEffect(() => {
                const rate = parseFloat(playbackRate);
                playbackRateRef.current = rate;
                if(audioRef.current) {
                    audioRef.current.playbackRate = rate;
                }
            }, [playbackRate]);

            const processArabicText = useCallback((text, index) => {
                if (!text) return { bismillah: null, content: "" };
                const bismillahRegex = /^[\s\u200B-\u200D\uFEFF]*(بِسْمِ\s*ٱللَّهِ\s*ٱلرَّحْمَـٰنِ\s*ٱلرَّحِيمِ|بِسْمِ\s*اللَّهِ\s*الرَّحْمَٰنِ\s*الرَّحِيمِ)[\s\u06D6-\u06ED]*/;
                if (surahId !== 1 && surahId !== 9 && index === 0) {
                    const match = text.match(bismillahRegex);
                    if (match) {
                        return { bismillah: null, content: text.replace(bismillahRegex, '').trim() };
                    }
                }
                return { bismillah: null, content: text };
            }, [surahId]);

            const fetchWithCache = async (cacheKey) => {
                const cached = localStorage.getItem(cacheKey);
                if (cached) return JSON.parse(cached);
                const endpoints = [
                    `https://api.alquran.cloud/v1/surah/${surahId}/editions/quran-uthmani,bn.bengali`,
                    `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api.alquran.cloud/v1/surah/${surahId}/editions/quran-uthmani,bn.bengali`)}`,
                    `https://corsproxy.io/?${encodeURIComponent(`https://api.alquran.cloud/v1/surah/${surahId}/editions/quran-uthmani,bn.bengali`)}`
                ];
                for (const url of endpoints) {
                    try {
                        const controller = new AbortController();
                        const id = setTimeout(() => controller.abort(), 8000); 
                        const res = await fetch(url, { signal: controller.signal });
                        clearTimeout(id);
                        if (res.ok) {
                            const data = await res.json();
                            if (data.code === 200 && data.data && data.data.length >= 2) {
                                const transformed = { code: 200, data: [{ ayahs: data.data[0].ayahs }, { ayahs: data.data[1].ayahs }] };
                                try { localStorage.setItem(cacheKey, JSON.stringify(transformed)); } catch(e){}
                                return transformed;
                            }
                        }
                    } catch (e) { console.warn(`Fetch failed for ${url}`, e); }
                }
                throw new Error("ডাটা লোড করা যাচ্ছে না। ইন্টারনেট সংযোগ চেক করুন।");
            };

            const loadData = async () => {
                setIsLoading(true);
                setError(null);
                try {
                    const data = await fetchWithCache(`surah_v10_${surahId}`);
                    setAyahs(data.data[0].ayahs.map((a, i) => {
                        const processed = processArabicText(a.text, i);
                        return { id: a.numberInSurah || (i + 1), ar: processed.content, bismillah: processed.bismillah, bn: data.data[1].ayahs[i]?.text || "অনুবাদ উপলব্ধ নেই", globalId: a.number };
                    }));
                } catch (e) { setError("ডাটা লোড করা সম্ভব হয়নি।"); setAyahs([]); } finally { setIsLoading(false); }
            };

            useEffect(() => {
                loadData();
                setSurahData(null); 
                return () => { if(audioRef.current) audioRef.current.pause(); isPlayingRef.current = false; };
            }, [surahId, processArabicText]);

            const scrollToAyah = (id) => {
                const element = document.getElementById(`ayah-${id}`);
                if (element) element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };

            const loadSurahIntro = async () => {
                setShowIntro(true);
                if (surahData) return;
                try {
                    const prompt = `Generate a JSON object for Surah ${surahInfo.nameBn} (${surahInfo.nameEn}) in Bengali. Keys: "intro", "history", "themes" (array), "teachings" (array). Guidelines: Use **Bold** for headings/key terms and *Italic* for spiritual emphasis or quotes. Write in beautiful, flowing Bengali.`;
                    const data = await fetchGeminiResponse(prompt, true);
                    if (data) setSurahData(data);
                } catch(e) { console.error(e); }
            };

            const handleCopy = (text, id) => {
                navigator.clipboard.writeText(text).then(() => { setCopiedAyahId(id); setTimeout(() => setCopiedAyahId(null), 2000); });
            };

            const playAudio = (url, onEnd, isFallback = false) => {
                if (audioRef.current) { audioRef.current.pause(); audioRef.current.currentTime = 0; }
                const audio = new Audio(url);
                audioRef.current = audio;
                audio.playbackRate = playbackRateRef.current;
                
                const safePlay = async () => {
                    try { await audio.play(); } catch (e) {
                        if (e.name !== 'AbortError') {
                             if (!isFallback) playAudio(url.replace('everyayah.com', 'mirrors.quranicaudio.com/everyayah'), onEnd, true);
                             else if(onEnd) onEnd();
                        }
                    }
                };
                safePlay();
                audio.onended = () => { if (isPlayingRef.current && onEnd) onEnd(); };
                audio.onerror = () => { if (!isFallback) playAudio(url.replace('everyayah.com', 'mirrors.quranicaudio.com/everyayah'), onEnd, true); else if (onEnd) onEnd(); };
            };

            const playSequence = (sequence) => {
                if (!sequence.length || !isPlayingRef.current) {
                    setIsSurahPlaying(false); setPlayingAyah(null); isPlayingRef.current = false; return;
                }
                const [next, ...rest] = sequence;
                if (next.type === 'istiadha') {
                    playAudio("https://server8.mp3quran.net/afs/000.mp3", () => playSequence(rest));
                } else if (next.type === 'bismillah') {
                    playAudio("https://everyayah.com/data/Alafasy_128kbps/001001.mp3", () => playSequence(rest));
                } else if (next.type === 'ayah') {
                    if (!ayahs[next.index]) {
                         setIsSurahPlaying(false); setPlayingAyah(null); isPlayingRef.current = false; return;
                    }
                    setPlayingAyah(ayahs[next.index].id);
                    scrollToAyah(ayahs[next.index].id);
                    const s = String(surahId).padStart(3, '0');
                    const a = String(ayahs[next.index].id).padStart(3, '0');
                    playAudio(`https://everyayah.com/data/Alafasy_128kbps/${s}${a}.mp3`, () => {
                        if (next.index + 1 < ayahs.length) playSequence([{type: 'ayah', index: next.index + 1}]);
                        else { setIsSurahPlaying(false); setPlayingAyah(null); isPlayingRef.current = false; }
                    });
                }
            };

            const togglePlayPause = () => {
                if (isSurahPlaying) {
                    isPlayingRef.current = false; setIsSurahPlaying(false); if (audioRef.current) audioRef.current.pause();
                } else {
                    isPlayingRef.current = true; setIsSurahPlaying(true);
                    if (playingAyah) {
                        const idx = ayahs.findIndex(a => a.id === playingAyah); playSequence([{type: 'ayah', index: idx !== -1 ? idx : 0}]);
                    } else {
                        const seq = [{type: 'istiadha'}];
                        if (surahId !== 1 && surahId !== 9) seq.push({type: 'bismillah'});
                        seq.push({type: 'ayah', index: 0});
                        playSequence(seq);
                    }
                }
            };

            const playNextAyah = () => {
                const currentIdx = ayahs.findIndex(a => a.id === playingAyah);
                if (currentIdx !== -1 && currentIdx + 1 < ayahs.length) {
                    isPlayingRef.current = true; setIsSurahPlaying(true); playSequence([{type: 'ayah', index: currentIdx + 1}]);
                }
            };

            const playPrevAyah = () => {
                const currentIdx = ayahs.findIndex(a => a.id === playingAyah);
                if (currentIdx > 0) {
                    isPlayingRef.current = true; setIsSurahPlaying(true); playSequence([{type: 'ayah', index: currentIdx - 1}]);
                }
            };

            const handleSinglePlay = (index) => {
                isPlayingRef.current = false; setIsSurahPlaying(false); setPlayingAyah(ayahs[index].id);
                const s = String(surahId).padStart(3, '0');
                const a = String(ayahs[index].id).padStart(3, '0');
                playAudio(`https://everyayah.com/data/Alafasy_128kbps/${s}${a}.mp3`, () => setPlayingAyah(null));
            };

            return (
                <div className="container mx-auto px-4 py-8 max-w-5xl pb-32 animate-fade-in">
                    <div className="sticky top-16 z-40 py-4 px-2 -mx-2 bg-[#022c22]/95 backdrop-blur-md border-b border-gray-800/50 flex items-center justify-between mb-6 transition-all">
                        <button onClick={() => setPage('surahList')} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-[#0a382e] hover:bg-[#0d4236] transition-colors text-gray-300">
                            <ChevronLeft className="w-5 h-5" /> ফিরে যান
                        </button>
                        <button onClick={loadSurahIntro} className="flex items-center gap-2 px-5 py-2 rounded-full bg-green-600 text-white hover:bg-green-700 transition-colors font-bold shadow-lg">
                            <Info className="w-5 h-5" /> সূরা পরিচিতি
                        </button>
                    </div>

                    <div className="rounded-3xl p-10 text-center border border-gray-800 bg-[#0a382e] relative overflow-hidden shadow-2xl mb-10">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-green-500 to-transparent"></div>
                        <h1 className="text-5xl font-bold mb-4 font-serif text-green-400">{surahInfo.nameBn}</h1>
                        <div className="flex justify-center items-center gap-3 text-sm opacity-80 mb-8">
                            <span className="px-3 py-1 rounded-full border border-gray-600 bg-black/20">{surahInfo.typeBn}</span>
                            <span>•</span>
                            <span>{(surahInfo.ayahs || 0).toLocaleString('bn-BD')} আয়াত</span>
                        </div>
                        <button onClick={togglePlayPause} className="flex items-center gap-3 mx-auto bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-full font-bold transition-all shadow-xl hover:scale-105 active:scale-95">
                            {isSurahPlaying ? <Pause className="w-6 h-6" /> : <Play className="w-6 h-6" />}
                            {isSurahPlaying ? "পজ করুন" : "সূরা শুনুন"}
                        </button>
                        {surahId !== 9 && surahId !== 1 && <div className="text-4xl font-arabic mt-10 text-green-200">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>}
                    </div>

                    <div className="flex flex-col gap-4">
                        {isLoading ? (
                            <div className="text-center py-20 text-green-500"><Loader2 className="w-10 h-10 animate-spin mx-auto" /></div>
                        ) : error ? (
                            <div className="text-center py-20">
                                <p className="text-red-400 mb-4">{error}</p>
                                <button onClick={loadData} className="px-6 py-2 bg-green-600 rounded-full text-white hover:bg-green-700 flex items-center gap-2 mx-auto"><RefreshCw className="w-4 h-4"/> পুনরায় চেষ্টা করুন</button>
                            </div>
                        ) : ayahs.slice(0, visibleCount).map((ayah, i) => (
                            <div key={ayah.id} id={`ayah-${ayah.id}`} className={`rounded-2xl border p-6 md:p-8 transition-all duration-500 ${playingAyah === ayah.id ? 'highlight-ayah border-green-500 bg-[#0d4236]' : 'bg-[#0a382e] border-gray-800'}`}>
                                <div className="flex justify-between items-start mb-6">
                                    <div className="w-10 h-10 rounded-full flex items-center justify-center font-bold bg-[#022c22] text-green-500 border border-gray-700 shadow-sm">{(ayah.id || i + 1).toLocaleString('bn-BD')}</div>
                                    <div className="flex gap-2">
                                        <button onClick={() => handleSinglePlay(i)} className="p-2 text-gray-400 hover:text-green-500 rounded-lg hover:bg-green-900/30" title="শুনুন"><Play className="w-4 h-4" /></button>
                                        
                                        <button 
                                            onClick={() => handleCopy(`${ayah.ar}\n\n${ayah.bn} [${surahInfo.nameBn}:${ayah.id}]`, ayah.id)} 
                                            className={`p-2 rounded-lg transition-colors ${copiedAyahId === ayah.id ? 'text-green-500 bg-green-900/30' : 'text-gray-400 hover:text-green-500 hover:bg-green-900/30'}`}
                                            title="কপি করুন"
                                        >
                                            {copiedAyahId === ayah.id ? <CheckCircle2 className="w-4 h-4" /> : <Copy className="w-4 h-4" />}
                                        </button>

                                        <button onClick={() => {
                                            setActiveTafsirAyah(ayah); setShowTafsir(true); setTafsirText("লোড হচ্ছে...");
                                            fetchGeminiResponse(`সূরা ${surahInfo.nameBn}, আয়াত ${ayah.id} এর তাফসীর ও শিক্ষা বাংলায় লিখুন। Tables can be used if needed.`).then(t => setTafsirText(t)).catch(() => setTafsirText("দুঃখিত, তথ্য পাওয়া যায়নি।"));
                                        }} className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm bg-[#022c22] hover:bg-[#053a2d] text-gray-300 border border-gray-700 transition-colors">
                                            <FileText className="w-4 h-4" /> তাফসীর
                                        </button>
                                    </div>
                                </div>
                                <p className="text-right font-arabic text-2xl md:text-4xl leading-[2.5] mb-8 text-gray-100">{ayah.ar}</p>
                                <p className="text-xl leading-relaxed text-gray-300 border-l-2 border-gray-700 pl-4">{ayah.bn}</p>
                            </div>
                        ))}
                    </div>
                    {!isLoading && !error && ayahs.length > visibleCount && <div className="text-center mt-8"><button onClick={() => setVisibleCount(p => p+20)} className="px-6 py-2 bg-green-900/50 text-green-400 rounded-full hover:bg-green-900">আরও দেখুন</button></div>}

                    {/* Fixed Floating Player */}
                    {isSurahPlaying && (
                        <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 w-[95%] md:w-3/4 max-w-2xl p-4 rounded-2xl border border-gray-600 shadow-2xl glass-player z-50 flex flex-col gap-3 animate-slide-in-up">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full bg-green-500 flex items-center justify-center animate-pulse"><Volume2 className="w-5 h-5 text-white" /></div>
                                    <div>
                                        <div className="font-bold text-sm text-green-400">{surahInfo.nameBn}</div>
                                        <div className="text-xs text-gray-300">আয়াত: {playingAyah || '...'}</div>
                                    </div>
                                </div>
                                {/* Speed Control */}
                                <div className="flex items-center gap-1 bg-black/30 rounded-lg px-2 py-1">
                                    <Gauge className="w-3 h-3 text-gold" />
                                    <select 
                                        value={playbackRate} 
                                        onChange={(e) => setPlaybackRate(e.target.value)}
                                        className="bg-transparent text-xs text-gold font-bold focus:outline-none cursor-pointer appearance-none pl-1"
                                    >
                                        <option value="0.5" className="bg-[#022c22]">0.5x</option>
                                        <option value="0.75" className="bg-[#022c22]">0.75x</option>
                                        <option value="1" className="bg-[#022c22]">1.0x</option>
                                        <option value="1.25" className="bg-[#022c22]">1.25x</option>
                                        <option value="1.5" className="bg-[#022c22]">1.5x</option>
                                        <option value="2.0" className="bg-[#022c22]">2.0x</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div className="flex items-center justify-center gap-6 border-t border-white/10 pt-2">
                                <button onClick={playPrevAyah} className="p-2 text-gray-300 hover:text-white transition-colors"><SkipBack className="w-6 h-6" /></button>
                                <button onClick={togglePlayPause} className="w-12 h-12 rounded-full bg-green-600 text-white flex items-center justify-center hover:scale-110 transition-transform shadow-lg">
                                    <Pause className="w-6 h-6 fill-current" />
                                </button>
                                <button onClick={playNextAyah} className="p-2 text-gray-300 hover:text-white transition-colors"><SkipForward className="w-6 h-6" /></button>
                            </div>
                        </div>
                    )}

                    {/* Modals */}
                    <Modal isOpen={showIntro} onClose={() => setShowIntro(false)} title={`সূরা ${surahInfo.nameBn}`}>
                        {!surahData ? <div className="text-center py-10"><Loader2 className="w-8 h-8 animate-spin mx-auto text-green-500" /></div> : (
                            <div className="space-y-8 animate-fade-in">
                                <div className="grid md:grid-cols-2 gap-6">
                                    <div><h4 className="flex items-center gap-2 text-lg font-bold text-green-500 mb-3"><Info className="w-5 h-5"/> ভূমিকা</h4><div className="text-gray-300 text-sm leading-relaxed text-justify"><MarkdownRenderer content={surahData.intro} /></div></div>
                                    <div><h4 className="flex items-center gap-2 text-lg font-bold text-green-500 mb-3"><History className="w-5 h-5"/> ঐতিহাসিক প্রেক্ষাপট</h4><div className="text-gray-300 text-sm leading-relaxed text-justify"><MarkdownRenderer content={surahData.history} /></div></div>
                                </div>
                                <div className="p-6 rounded-2xl bg-[#022c22] border border-gray-700"><h4 className="font-bold text-orange-500 mb-4 flex items-center gap-2"><List className="w-5 h-5"/> মূল বিষয়বস্তু</h4><ul className="grid md:grid-cols-2 gap-3 text-sm text-gray-300">{surahData.themes?.map((t, i) => <li key={i} className="flex gap-2"><span className="w-1.5 h-1.5 rounded-full bg-orange-500 mt-2 shrink-0"></span><MarkdownRenderer content={typeof t === 'string' ? t : (t.theme || t.title || JSON.stringify(t))} /></li>)}</ul></div>
                                <div className="p-6 rounded-2xl bg-[#022c22] border border-gray-700"><h4 className="font-bold text-blue-500 mb-4 flex items-center gap-2"><Lightbulb className="w-5 h-5"/> শিক্ষা</h4><ul className="space-y-2 text-sm text-gray-300">{surahData.teachings?.map((t, i) => <li key={i} className="flex gap-2"><Check className="w-4 h-4 text-blue-500 mt-0.5 shrink-0"/>{typeof t === 'string' ? t : (t.teaching || t.text || JSON.stringify(t))}</li>)}</ul></div>
                            </div>
                        )}
                    </Modal>
                    <Modal isOpen={showTafsir} onClose={() => setShowTafsir(false)} title={`তাফসীর - আয়াত ${activeTafsirAyah?.id}`}>
                        <div className="space-y-6 animate-fade-in">
                            <div className="p-6 rounded-2xl text-right font-arabic text-3xl leading-[2.5] bg-[#022c22] border border-gray-700">{activeTafsirAyah?.ar}</div>
                            {!tafsirText || tafsirText === "লোড হচ্ছে..." ? <div className="flex items-center gap-2 text-green-500 animate-pulse"><Loader2 className="w-5 h-5 animate-spin"/>তাফসীর লোড হচ্ছে...</div> : <div className="prose prose-invert max-w-none"><MarkdownRenderer content={tafsirText} /></div>}
                        </div>
                    </Modal>
                </div>
            );
        };

        const SingleAyahView = ({ verseData, setPage }) => {
            const [tafsir, setTafsir] = useState("তাফসীর লোড হচ্ছে...");
            
            useEffect(() => {
                const loadTafsir = async () => {
                    try {
                        const prompt = `Provide a beautiful, detailed Tafsir (Explanation) and reflection for Quran Verse: ${verseData.ref}. The verse text is: "${verseData.bn}". Use **bold** for key themes and *italics* for spiritual points.`;
                        const response = await fetchGeminiResponse(prompt);
                        setTafsir(response);
                    } catch (e) {
                        setTafsir("দুঃখিত, তাফসীর লোড করা যায়নি।");
                    }
                };
                loadTafsir();
            }, [verseData]);

            return (
                <div className="container mx-auto px-4 py-8 max-w-4xl animate-fade-in">
                    <button onClick={() => setPage('home')} className="mb-6 flex items-center gap-2 px-4 py-2 rounded-xl bg-[#0a382e] hover:bg-[#0d4236] transition-colors text-gray-300">
                        <ChevronLeft className="w-5 h-5" /> ফিরে যান
                    </button>
                    
                    <div className="bg-[#0a382e] border border-gray-700 rounded-3xl p-8 md:p-12 shadow-2xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-green-500/5 rounded-full blur-3xl -mr-20 -mt-20"></div>
                        <div className="flex items-center justify-between mb-8 border-b border-gray-700 pb-4 relative z-10">
                            <h2 className="text-2xl font-bold text-green-500">{verseData.ref}</h2>
                            <Star className="w-6 h-6 text-gold fill-current animate-pulse" />
                        </div>
                        
                        <p className="text-right font-arabic text-2xl md:text-4xl leading-[2.5] mb-8 text-gray-100 relative z-10">
                            {verseData.ar}
                        </p>
                        
                        <p className="text-xl leading-relaxed text-gray-300 italic border-l-4 border-green-600 pl-6 mb-12 relative z-10">
                            "{verseData.bn}"
                        </p>
                        
                        <div className="bg-[#022c22] rounded-2xl p-6 md:p-8 border border-gray-800 relative z-10">
                            <h3 className="text-xl font-bold text-gold mb-4 flex items-center gap-2">
                                <BookOpen className="w-5 h-5" /> তাফসীর ও শিক্ষা
                            </h3>
                            <div className="prose prose-invert max-w-none text-gray-300">
                                <MarkdownRenderer content={tafsir} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SurahList = ({ setPage, setActiveSurah, bookmarks, toggleBookmark }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [filter, setFilter] = useState('all'); 
            
            const filtered = surahListFull.filter(s => {
                const matchesSearch = s.nameEn.toLowerCase().includes(searchTerm.toLowerCase()) || s.nameBn.includes(searchTerm);
                if (filter === 'bookmarks') {
                    return matchesSearch && bookmarks.includes(s.id);
                }
                return matchesSearch;
            });

            return (
                <div className="container mx-auto px-4 py-8">
                    <div className="flex flex-col md:flex-row gap-4 mb-8 items-center justify-between">
                        <div className="relative group w-full md:w-2/3">
                            <input 
                                type="text" 
                                placeholder="সূরা খুঁজুন (বাংলা বা ইংরেজিতে)..." 
                                onChange={e => setSearchTerm(e.target.value)} 
                                className="w-full bg-[#0a382e] border border-gray-700 rounded-full py-4 pl-12 pr-4 text-white focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 placeholder-gray-400 shadow-lg transition-all" 
                            />
                            <Search className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400 group-hover:text-green-400 transition-colors" />
                        </div>
                        <div className="flex bg-[#0a382e] rounded-full p-1 border border-gray-700">
                            <button onClick={() => setFilter('all')} className={`px-4 py-2 rounded-full text-sm font-bold transition-all ${filter === 'all' ? 'bg-green-600 text-white' : 'text-gray-400 hover:text-white'}`}>সব সূরা</button>
                            <button onClick={() => setFilter('bookmarks')} className={`px-4 py-2 rounded-full text-sm font-bold transition-all flex items-center gap-2 ${filter === 'bookmarks' ? 'bg-green-600 text-white' : 'text-gray-400 hover:text-white'}`}><Heart className="w-3 h-3 fill-current" /> পছন্দের</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {filtered.map(s => (
                            <div key={s.id} className="bg-[#0a382e] border border-gray-700 rounded-xl p-5 hover:border-green-500/50 flex items-center justify-between group transition-all hover:bg-[#0d4236] relative hover:shadow-lg">
                                <div className="flex items-center gap-4 flex-1 cursor-pointer" onClick={() => { setActiveSurah(s.id); setPage('surahDetail'); }}>
                                    <div className="w-12 h-12 bg-[#022c22] rounded-xl flex items-center justify-center font-bold text-green-400 border border-gray-700 group-hover:border-green-500/50 shadow-sm">{s.id.toLocaleString('bn-BD')}</div>
                                    <div>
                                        <h3 className="font-bold text-lg group-hover:text-green-400 transition-colors">{s.nameBn}</h3>
                                        <div className="flex items-center gap-2 text-xs text-gray-400">
                                            <span>{s.nameEn}</span>
                                            <span className="w-1 h-1 rounded-full bg-gray-600"></span>
                                            <span className="text-green-500 italic">{s.meaning}</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex flex-col items-end gap-2">
                                    <button onClick={(e) => { e.stopPropagation(); toggleBookmark(s.id); }} className="text-gray-500 hover:text-red-500 transition-colors p-1">
                                        <Heart className={`w-5 h-5 ${bookmarks.includes(s.id) ? 'fill-red-500 text-red-500' : ''}`} />
                                    </button>
                                    <div className="text-xs text-gray-500 bg-black/20 px-2 py-0.5 rounded-full">{s.ayahs.toLocaleString('bn-BD')} আয়াত</div>
                                </div>
                            </div>
                        ))}
                        {filtered.length === 0 && <div className="col-span-full text-center py-10 text-gray-500">কোনো সূরা পাওয়া যায়নি।</div>}
                    </div>
                </div>
            );
        };

        const AIChatPage = () => {
            const [messages, setMessages] = useState([{ id: 1, type: 'bot', text: "আসসালামু আলাইকুম! আমি **নূর-ই-কুরআন এআই**। ইসলাম বা কুরআন সম্পর্কে আপনার যেকোনো প্রশ্ন করুন।" }]);
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const scrollRef = useRef(null);

            const handleSend = async (txt) => {
                const userText = txt || input;
                if(!userText.trim()) return;
                
                setMessages(p => [...p, {id: Date.now(), type: 'user', text: userText}]);
                setInput('');
                setIsTyping(true);
                const response = await fetchGeminiResponse(`You are a knowledgeable Islamic AI Scholar named Noor-e-Quran. User: "${userText}". Answer in Bengali. Use **bold** for key terms.`);
                setMessages(p => [...p, {id: Date.now()+1, type: 'bot', text: response}]);
                setIsTyping(false);
            };

            useEffect(() => { scrollRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            return (
                <div className="container mx-auto px-4 py-6 max-w-4xl h-[calc(100vh-80px)] flex flex-col animate-fade-in">
                    <div className="flex-1 rounded-3xl border border-gray-800 bg-[#0a382e] p-6 overflow-y-auto mb-4 custom-scrollbar relative">
                        {messages.length === 0 && <div className="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none"><Sparkles className="w-32 h-32"/></div>}
                        {messages.map(m => (
                            <div key={m.id} className={`flex mb-6 ${m.type === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[90%] p-5 rounded-2xl shadow-md ${m.type === 'user' ? 'bg-green-600 text-white rounded-tr-none' : 'bg-[#022c22] border border-gray-700 text-gray-200 rounded-tl-none'}`}>
                                    {m.type === 'bot' && <div className="flex items-center gap-2 mb-3 text-xs font-bold uppercase tracking-wider opacity-70 border-b border-gray-600 pb-2 text-green-400"><Sparkles className="w-3 h-3"/> নূর-ই-কুরআন এআই</div>}
                                    {m.type === 'bot' ? <div className="leading-relaxed"><MarkdownRenderer content={m.text} /></div> : <div className="leading-relaxed">{m.text}</div>}
                                </div>
                            </div>
                        ))}
                        {isTyping && <div className="flex items-center gap-2 text-xs text-green-500 animate-pulse ml-4"><BrainCircuit className="w-4 h-4" /> এআই উত্তর লিখছে<span className="typing-cursor"></span></div>}
                        <div ref={scrollRef} />
                    </div>
                    <div className="relative">
                        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()} className="w-full p-4 pl-6 pr-16 rounded-full border border-gray-700 bg-[#0a382e] text-white focus:outline-none focus:ring-2 focus:ring-green-500 placeholder-gray-500 shadow-xl" placeholder="আপনার প্রশ্ন এখানে লিখুন..." />
                        <button 
                            onClick={() => handleSend(null)} 
                            disabled={!input.trim() || isTyping}
                            className={`absolute right-2 top-2 bottom-2 w-12 h-12 rounded-full flex items-center justify-center transition-transform hover:scale-105 ${!input.trim() || isTyping ? 'bg-gray-600 cursor-not-allowed opacity-50' : 'bg-green-600 hover:bg-green-700'}`}
                        >
                            <Send className="w-5 h-5 text-white" />
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activePage, setActivePage] = useState('home');
            const [activeSurahId, setActiveSurahId] = useState(1);
            const [singleAyahData, setSingleAyahData] = useState(null);
            
            // Bookmark State
            const [bookmarks, setBookmarks] = useState(() => {
                const saved = localStorage.getItem('quranBookmarks');
                return saved ? JSON.parse(saved) : [];
            });

            const toggleBookmark = (id) => {
                const newBookmarks = bookmarks.includes(id) 
                    ? bookmarks.filter(bid => bid !== id)
                    : [...bookmarks, id];
                setBookmarks(newBookmarks);
                localStorage.setItem('quranBookmarks', JSON.stringify(newBookmarks));
            };
            
            return (
                <div className="min-h-screen font-sans bg-[#022c22] text-white selection:bg-green-500/30">
                    <Header setPage={setActivePage} activePage={activePage} />
                    <main className="animate-fade-in pb-20 md:pb-0">
                        {activePage === 'home' && <HomeSection setPage={setActivePage} setSingleAyahData={setSingleAyahData} />}
                        {activePage === 'surahList' && <SurahList setPage={setActivePage} setActiveSurah={setActiveSurahId} bookmarks={bookmarks} toggleBookmark={toggleBookmark} />}
                        {activePage === 'duas' && <DuaPage />}
                        {activePage === 'names99' && <Names99Section />}
                        {activePage === 'surahDetail' && <SurahDetail surahId={activeSurahId} setPage={setActivePage} setToast={(msg) => console.log(msg)} />}
                        {activePage === 'aiChat' && <AIChatPage />}
                        {activePage === 'singleAyah' && <SingleAyahView verseData={singleAyahData} setPage={setActivePage} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
